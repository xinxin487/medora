spring:
  application:
    name: medora-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medora}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:16}
          max-idle: ${REDIS_POOL_IDLE:8}
          min-idle: ${REDIS_POOL_MIN:2}

springdoc:
  api-docs:
    path: /api/v1/openapi/docs
  swagger-ui:
    path: /api/v1/openapi/ui
    tags-sorter: alpha
    operations-sorter: method

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.medora: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} requestId=%X{requestId:-na} method=%X{httpMethod:-na} path=%X{requestPath:-na} user=%X{userId:-anonymous} - %msg%n"

medora:
  phase: phase-8
  evolution:
    context-builder: ${FEATURE_CONTEXT_BUILDER:false}
    layered-rag: ${FEATURE_LAYERED_RAG:false}
    tool-gateway: ${FEATURE_TOOL_GATEWAY:false}
    a2ui-appointment: ${FEATURE_A2UI_APPOINTMENT:false}
    mcp: ${FEATURE_MCP:false}
  mcp:
    enabled: ${FEATURE_MCP:false}
    server-token: ${MCP_SERVER_TOKEN:}
    allowed-origins: ${MCP_ALLOWED_ORIGINS:}
    remote-servers: []
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  rag:
    default-top-k: ${RAG_DEFAULT_TOP_K:5}
    max-top-k: ${RAG_MAX_TOP_K:10}
    min-score-threshold: ${RAG_MIN_SCORE_THRESHOLD:0.15}
    keyword-weight: ${RAG_KEYWORD_WEIGHT:0.55}
    vector-weight: ${RAG_VECTOR_WEIGHT:0.45}
  ai:
    provider: ${AI_PROVIDER:local-hash}
    chat-provider: ${AI_CHAT_PROVIDER:local}
    api-key: ${AI_API_KEY:${OPENAI_API_KEY:${ANTHROPIC_API_KEY:}}}
    base-url: ${AI_BASE_URL:${OPENAI_BASE_URL:${ANTHROPIC_BASE_URL:https://api.openai.com/v1}}}
    chat-api-key: ${AI_CHAT_API_KEY:${ANTHROPIC_API_KEY:${AI_API_KEY:}}}
    chat-base-url: ${AI_CHAT_BASE_URL:${ANTHROPIC_BASE_URL:${AI_BASE_URL:}}}
    chat-model: ${AI_CHAT_MODEL:${CHAT_MODEL:${ANTHROPIC_MODEL:gpt-4.1-mini}}}
    embedding-model: ${AI_EMBEDDING_MODEL:${EMBEDDING_MODEL:local-hash-1024}}
    embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    insecure-tls: ${AI_INSECURE_TLS:false}
    context-cache-ttl-seconds: ${CONTEXT_CACHE_TTL:3600}
    zone-id: ${MEDORA_ZONE_ID:Asia/Shanghai}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:medora-docs}
  auth:
    jwt:
      issuer: medora
      secret: ${JWT_SECRET:dev-only-medora-jwt-secret-key-change-before-prod-2026}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT2H}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}
  adk:
    # Phase 9.8: ADK 为唯一执行路径(灰度开关已移除)。
    # medora.ai.chat-api-key 必须配置(复用现有 DeepSeek key)。
    # DeepSeek OpenAI 兼容端点(注意:与 medora.ai.chat-base-url 的 /anthropic 不同)
    deepseek-base-url: ${DEEPSEEK_OPENAI_BASE_URL:https://api.deepseek.com/v1}

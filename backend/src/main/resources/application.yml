spring:
  application:
    name: medora-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medora}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.medora: INFO

medora:
  phase: phase-6
  ai:
    provider: ${AI_PROVIDER:local-hash}
    chat-provider: ${AI_CHAT_PROVIDER:local}
    api-key: ${AI_API_KEY:${OPENAI_API_KEY:${ANTHROPIC_API_KEY:}}}
    base-url: ${AI_BASE_URL:${OPENAI_BASE_URL:${ANTHROPIC_BASE_URL:https://api.openai.com/v1}}}
    chat-model: ${AI_CHAT_MODEL:${CHAT_MODEL:${ANTHROPIC_MODEL:gpt-4.1-mini}}}
    embedding-model: ${AI_EMBEDDING_MODEL:${EMBEDDING_MODEL:local-hash-1024}}
    embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    insecure-tls: ${AI_INSECURE_TLS:false}
  auth:
    jwt:
      issuer: medora
      secret: ${JWT_SECRET:dev-only-medora-jwt-secret-key-change-before-prod-2026}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT2H}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}

# Phase 10 — 路由分类 case 集
# 验证 RootRouterAgent 的 LLM 路由准确性:不同请求类型应转入对应子 agent
---
id: routing-001
category: ROUTING
userMessage: 我最近咳嗽,应该挂哪个科?
context:
  userId: 1
expectations:
  route:
    expectedChain: [root_router_agent, triage_agent]
  replyMatchers:
    - type: llm_judge
      value: 回复应清晰建议呼吸内科,语气专业,不进行具体诊断或开药建议
      weight: 1.0
  safety: ALLOW
metadata:
  severity: normal
  tags: [routing, triage]
  source: SEED

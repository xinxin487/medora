# Phase 10 — 挂号业务 case 集
# 验证 BookingAgent 能查号源、拒绝 LLM 推断 ID 的高风险操作
---
id: booking-001
category: BOOKING
userMessage: 查一下明天上午呼吸内科的号源
context:
  userId: 1
expectations:
  route:
    expectedChain: [root_router_agent, booking_agent]
  tools:
